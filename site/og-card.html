<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InAR AI Social Card</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Arial,sans-serif;background:#05070b;color:#fff}.card{position:relative;width:100%;height:100%;padding:72px 78px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:radial-gradient(circle at 82% 32%,rgba(92,113,238,.27),transparent 38%),linear-gradient(130deg,#05070b,#0a101a)}.blueprint{position:absolute;inset:0;background:url('assets/inar-hospital-blueprint.png') center/cover no-repeat;opacity:.22;mix-blend-mode:screen}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(132,149,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(132,149,255,.08) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(90deg,transparent,black 42%,transparent)}.top,.content,.footer{position:relative;z-index:2}.top{display:flex;justify-content:space-between;align-items:center}.top img{width:430px;height:116px;object-fit:contain;object-position:left center}.badge{display:flex;align-items:center;padding:14px 20px;border:1px solid rgba(190,201,255,.25);border-radius:13px;background:rgba(10,14,22,.72);color:#d7ddff;font-size:17px}.content{max-width:910px}.eyebrow{font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#9faeff;margin-bottom:22px}.content h1{font-size:66px;line-height:1.02;letter-spacing:-.055em;margin:0;font-weight:500}.content h1 span{color:#9aaaff}.footer{display:flex;align-items:center;justify-content:space-between;color:#aeb7c5;font-size:18px}.footer strong{color:#fff}.version{padding:11px 15px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:15px;color:#c4ccda}
  </style>
</head>
<body>
  <main class="card">
    <div class="blueprint"></div><div class="grid"></div>
    <div class="top"><img src="assets/inar-logo-full.webp" alt="InAR Ingegneria Architettura"><div class="badge">Area riservata</div></div>
    <div class="content"><div class="eyebrow">InAR AI</div><h1>La conoscenza dello studio,<br><span>pronta al dialogo.</span></h1></div>
    <div class="footer"><span><strong>Progetti, capitolati e procedure</strong> in un unico spazio.</span><span class="version">v0.1.7</span></div>
  </main>
</body>
</html>
