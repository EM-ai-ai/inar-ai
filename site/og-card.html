<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InAR AI Social Card</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Arial,sans-serif;background:#05070b;color:#fff}.card{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,rgba(87,108,232,.32),transparent 44%),linear-gradient(145deg,#05070b,#0b1220)}.blueprint{position:absolute;inset:0;background:url('assets/inar-hospital-blueprint.png') center/cover no-repeat;opacity:.19;mix-blend-mode:screen}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(132,149,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(132,149,255,.09) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(circle,black,transparent 78%)}.frame{position:absolute;inset:50px;border:1px solid rgba(177,190,255,.17);border-radius:42px}.content{position:relative;z-index:2;width:100%;padding:90px;text-align:center;display:flex;flex-direction:column;align-items:center}.app-logo{width:330px;height:330px;object-fit:contain;margin-bottom:54px;filter:drop-shadow(0 28px 55px rgba(0,0,0,.48))}.content h1{font-size:132px;line-height:.95;letter-spacing:-.07em;margin:0;font-weight:700}.content h1 span{color:#aab6ff}.subtitle{margin:32px 0 0;font-size:33px;line-height:1.28;color:#c2c9d5}.badge{position:absolute;z-index:2;top:82px;right:82px;padding:17px 23px;border:1px solid rgba(190,201,255,.25);border-radius:15px;background:rgba(10,14,22,.78);color:#d7ddff;font-size:20px}.version{position:absolute;z-index:2;left:82px;bottom:82px;font-size:20px;letter-spacing:.14em;color:#9facff}.domain{position:absolute;z-index:2;right:82px;bottom:82px;font-size:20px;color:#aeb7c5}
  </style>
</head>
<body>
  <main class="card">
    <div class="blueprint"></div><div class="grid"></div><div class="frame"></div>
    <div class="badge">Area riservata</div>
    <div class="content"><img class="app-logo" src="assets/inar-app-logo.png" alt="Logo InAR"><h1>InAR <span>AI</span></h1><p class="subtitle">La conoscenza dello studio,<br>pronta al dialogo.</p></div>
    <div class="version">V0.1.11</div><div class="domain">inar-ai.vercel.app</div>
  </main>
</body>
</html>
